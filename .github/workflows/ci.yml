name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Build WASM
        run: cargo build --locked --release --target wasm32-unknown-unknown

      # Run the host-free unit tests on the native target. The capsule's default
      # target is wasm (no test runner), and most of its tests call host fns that
      # trap natively — so this runs only the `fanout_collection` module: the pure
      # tool-describe responder-counting and cache-gating logic that guards
      # fan-out collection determinism.
      - name: Unit tests (fan-out collection logic)
        run: cargo test --target "$(rustc -vV | sed -n 's/host: //p')" --lib -- tests::fanout_collection

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
